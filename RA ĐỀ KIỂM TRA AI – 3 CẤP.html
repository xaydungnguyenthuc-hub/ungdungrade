<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RA ĐỀ KIỂM TRA AI – 3 CẤP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fb;--surface:#fff;--surface2:#f6f9ff;--text:#14213d;--muted:#5b6b86;--primary:#1d5fd1;--primary-d:#164aa6;--primary-soft:#e5eefc;--border:#d6e0f0;--ok:#127a46;--ok-bg:#e3f6ec;--warn:#9a5b00;--warn-bg:#fff3d9;--err:#b42318;--err-bg:#fde8e6;--shadow:0 1px 3px rgba(20,33,61,.08),0 4px 14px rgba(20,33,61,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#16213a;--surface2:#1a2744;--text:#e8eefc;--muted:#97a8c9;--primary:#5b9bff;--primary-d:#82b2ff;--primary-soft:#1d3157;--border:#2b3b61;--ok:#4cd08a;--ok-bg:#12332a;--warn:#f2b957;--warn-bg:#3a2d12;--err:#ff8a7d;--err-bg:#40191a}}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#16213a;--surface2:#1a2744;--text:#e8eefc;--muted:#97a8c9;--primary:#5b9bff;--primary-d:#82b2ff;--primary-soft:#1d3157;--border:#2b3b61;--ok:#4cd08a;--ok-bg:#12332a;--warn:#f2b957;--warn-bg:#3a2d12;--err:#ff8a7d;--err-bg:#40191a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.topbar{background:linear-gradient(135deg,#164aa6,#1d5fd1 60%,#3b82f6);color:#fff;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:#1d5fd1;display:grid;place-items:center;font-weight:700;font-size:16px}
.topbar h1{margin:0;font-size:19px;letter-spacing:.2px}
.topbar p{margin:0;font-size:12.5px;opacity:.92}
.top-actions{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px}
.tbtn:hover{background:rgba(255,255,255,.28)}
.layout{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);gap:14px;padding:14px;align-items:start}
.panel,.preview{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.panel{position:sticky;top:8px;display:flex;flex-direction:column;max-height:calc(100vh - 16px)}
.stepper{flex:0 0 auto;display:flex;gap:4px;padding:10px 10px 6px;overflow-x:auto;border-bottom:1px solid var(--border)}
.stp{flex:1 0 auto;min-width:58px;white-space:nowrap;border:1px solid var(--border);background:var(--surface2);border-radius:9px;padding:5px 6px;font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
.stp b{display:block;font-size:13px;color:var(--text)}
.stp.on{background:var(--primary);border-color:var(--primary);color:#fff}.stp.on b{color:#fff}
.stp.done b::after{content:" ✓";color:var(--ok)}.stp.on.done b::after{color:#fff}
.stepbody{padding:14px;overflow-y:auto;flex:1;min-height:200px}
.stepbody h2{font-size:15px;margin:2px 0 10px;color:var(--primary)}
.stepbody h3{font-size:13px;margin:14px 0 6px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.lvcard{border:2px solid var(--border);background:var(--surface2);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;gap:2px;align-items:center}
.lvcard b{font-size:14px}.lvcard span{font-size:11.5px;color:var(--muted)}
.lvcard.on{border-color:var(--primary);background:var(--primary-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.fld{display:block;margin:0 0 10px}.fld>span{display:block;font-size:12.5px;font-weight:600;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 9px}
textarea{resize:vertical;min-height:60px}
textarea.big{min-height:170px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cnt{display:grid;grid-template-columns:1fr 78px;gap:8px;align-items:center;margin-bottom:6px}
.cnt label{font-size:13px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary)}
.alert{border-radius:9px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.alert.ok{background:var(--ok-bg);color:var(--ok)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.err{background:var(--err-bg);color:var(--err)}.alert.info{background:var(--primary-soft);color:var(--primary-d)}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;font-size:13px;background:var(--surface2)}
.radio input{margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg button{border:0;background:var(--surface2);padding:6px 14px}.seg button.on{background:var(--primary);color:#fff}
.doc{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:5px 8px;margin-bottom:5px;font-size:12.5px;background:var(--surface2)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-d);color:#fff}
.btn.danger{color:var(--err)}.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel-foot{border-top:1px solid var(--border);padding:10px 12px;display:grid;gap:8px;background:var(--surface2);border-radius:0 0 14px 14px}
.navrow{display:flex;justify-content:space-between;gap:8px}
.bigbtn{width:100%;padding:12px;font-size:15px;font-weight:700;border-radius:11px;border:0;background:linear-gradient(135deg,#1d5fd1,#3b82f6);color:#fff;box-shadow:0 3px 10px rgba(29,95,209,.35)}
.bigbtn:disabled{opacity:.6}
.preview{padding:12px;min-width:0}
.ptoolbar{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;border-bottom:2px solid var(--border);align-items:flex-end}
.tab{border:0;background:none;padding:8px 12px;white-space:nowrap;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
.tab.on{color:var(--primary);border-color:var(--primary)}
.tabs .sp{flex:1}
.tabs select{width:auto;padding:3px 6px;margin:0 4px 4px}
.pcontent{padding:14px 2px;min-width:0}
.empty{text-align:center;color:var(--muted);padding:34px 14px}
.empty h3{color:var(--text);margin:8px 0}
.checklist{display:inline-block;text-align:left;margin-top:10px}
.checklist div{padding:2px 0}
.foot{padding:4px 18px 18px;text-align:center;color:var(--muted);font-size:12.5px}
.sheet{background:#fff;color:#111;font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.5;border:1px solid var(--border);border-radius:6px;padding:26px 30px;max-width:850px;margin:0 auto 14px;box-shadow:var(--shadow)}
.sheet h4{margin:14px 0 4px;font-size:1em}
.exh{margin-bottom:12px}
.exh-top{display:flex;justify-content:space-between;gap:10px}
.exh-title{text-align:center;font-weight:700;font-size:1.25em;margin:8px 0 2px}
.exh-sub{text-align:center;margin-bottom:8px}
.exh-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;border-top:1px solid #222;border-bottom:1px solid #222;padding:6px 0}
.exh-grid .full{grid-column:1/-1}
.sec{margin:14px 0 6px;font-weight:700}
.sec small{font-weight:400;display:block;font-style:italic}
.q{margin:8px 0;padding:4px 0;break-inside:avoid;page-break-inside:avoid;position:relative}
.qt{white-space:pre-wrap}
.opts{display:grid;gap:2px 16px;margin:3px 0 0 14px}
.opts.c1{grid-template-columns:1fr}.opts.c2{grid-template-columns:1fr 1fr}.opts.c4{grid-template-columns:repeat(4,1fr)}
.stm{margin:2px 0 0 14px}
.mt{width:100%;border-collapse:collapse;margin:4px 0}
.mt td{vertical-align:top;padding:2px 8px;border:0;width:50%}
.qact{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.flag{display:inline-block;font-family:'Be Vietnam Pro',sans-serif;font-size:11.5px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 7px;margin-left:6px}
.lock{display:inline-block;font-family:'Be Vietnam Pro',sans-serif;font-size:11.5px;background:#e5eefc;color:#164aa6;border-radius:6px;padding:1px 7px;margin-left:6px}
table.t{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:.93em}
table.t th,table.t td{border:1px solid #444;padding:4px 7px;vertical-align:top;text-align:left}
table.t th{background:#e8eefc;text-align:center}
table.t td.c{text-align:center}
.tw{overflow-x:auto;max-width:100%}
.cell small{display:block;color:#444;font-size:.85em}
.rowtot td{font-weight:700;background:#f3f6fc}
.ans{font-weight:700}
.blank{letter-spacing:1px}
.chk{display:grid;gap:8px;font-family:'Be Vietnam Pro',sans-serif}
.chk .it{display:flex;gap:10px;border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:var(--surface)}
.chk .it b{display:block}.chk .it span{color:var(--muted);font-size:13px}
.chk .ic{font-size:18px}
.modal-back{position:fixed;inset:0;background:rgba(10,20,40,.55);display:grid;place-items:center;z-index:50;padding:12px}
.modal{background:var(--surface);color:var(--text);border-radius:14px;width:min(720px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal.wide{width:min(960px,100%)}
.mh{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.mb{padding:14px 16px;overflow:auto;flex:1}
.mf{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.prog li{padding:5px 0;color:var(--muted);list-style:none}
.prog li.on{color:var(--primary);font-weight:700}.prog li.done{color:var(--ok)}
.prog li::before{content:"○ "}.prog li.on::before{content:"◔ "}.prog li.done::before{content:"✔ "}
.bar{height:8px;border-radius:99px;background:var(--primary-soft);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--primary);width:0;transition:width .3s}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:6px;max-width:92vw}
.toast{background:#14213d;color:#fff;border-radius:10px;padding:9px 14px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:13.5px}
.bk{border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--surface)}
.bk .m{font-size:12px;color:var(--muted);margin-bottom:3px}
.bk .qt{font-size:13.5px}
.flt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:10px}
.summary{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
.tg{display:flex;flex-wrap:wrap;gap:6px;padding-right:8px;border-right:1px solid var(--border)}
.tg.end{border-right:0;margin-left:auto;padding-right:0}
.q .qact{display:none}
.q:hover .qact,.q.sel .qact{display:flex}
.q.act .qt{padding-right:42px}
.qdots{position:absolute;right:0;top:0;opacity:.75}
.tpl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tpl .chip{font-size:12px;text-align:left;border-radius:9px}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.issue{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--border);border-radius:9px;padding:7px 10px;background:var(--surface)}
.sp2{margin-top:6px}
#printArea{display:none}
@media (pointer:coarse){.btn.sm{padding:9px 12px;min-height:40px}.chip{padding:9px 14px}.stp{padding:8px 6px}}
@media (max-width:480px){.xgrid{grid-template-columns:1fr}.tg{border-right:0;width:100%}.tg.end{margin-left:0}}
@media (max-width:920px){
 .layout{grid-template-columns:minmax(0,1fr);padding:10px}
 .panel{position:static;max-height:none}
 .stepbody{overflow:visible;flex:0 0 auto}
 .sheet{padding:16px 14px}
 .opts.c4{grid-template-columns:1fr 1fr}
 .exh-grid{grid-template-columns:1fr}
 .topbar h1{font-size:16px}
}
@media (max-width:480px){.cards{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.opts.c2{grid-template-columns:1fr}}
@media print{
 @page{size:A4;margin:16mm 14mm 18mm 14mm;@bottom-center{content:"Trang " counter(page) "/" counter(pages);font-size:10pt;font-family:"Times New Roman",serif}}
 html,body{background:#fff!important}
 .appshell,.modal-back,#toast{display:none!important}
 #printArea{display:block!important}
 #printArea .sheet{border:0;box-shadow:none;padding:0;max-width:none;margin:0;font-size:13pt;border-radius:0}
 #printArea .sheet.pb{break-after:page;page-break-after:always}
 #printArea .no-print{display:none!important}
 .tw{overflow:visible}
}
</style>
<style id="sheetcss">
.sheet,.sheet *{box-sizing:border-box}
.sheet{font-family:"Times New Roman",Times,serif;font-size:14pt;line-height:1.45;color:#111}
.exh-top{display:flex;justify-content:space-between}.exh-title{text-align:center;font-weight:700;font-size:1.2em;margin:8px 0 2px}.exh-sub{text-align:center;margin-bottom:8px}
.exh-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;border-top:1px solid #222;border-bottom:1px solid #222;padding:6px 0}.exh-grid .full{grid-column:1/-1}
.sec{margin:14px 0 6px;font-weight:700}.sec small{font-weight:400;display:block;font-style:italic}
.q{margin:8px 0;break-inside:avoid;page-break-inside:avoid}.qt{white-space:pre-wrap}
.opts{display:grid;gap:2px 16px;margin:3px 0 0 14px}.opts.c1{grid-template-columns:1fr}.opts.c2{grid-template-columns:1fr 1fr}.opts.c4{grid-template-columns:repeat(4,1fr)}
.stm{margin:2px 0 0 14px}.mt{width:100%;border-collapse:collapse}.mt td{vertical-align:top;padding:2px 8px;width:50%}
table.t{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:.93em}table.t th,table.t td{border:1px solid #444;padding:4px 7px;vertical-align:top;text-align:left}table.t th{background:#e8eefc;text-align:center}table.t td.c{text-align:center}
.cell small{display:block;color:#444;font-size:.85em}.rowtot td{font-weight:700;background:#f3f6fc}.ans{font-weight:700}
@media (max-width:640px){.opts.c4{grid-template-columns:1fr 1fr}.opts.c2{grid-template-columns:1fr}.exh-grid{grid-template-columns:1fr}}
.flag,.lock{font-size:.75em;border-radius:6px;padding:1px 7px;margin-left:6px;background:#fff3d9;color:#9a5b00}
</style>
</head>
<body>
<div class="appshell">
<header class="topbar">
 <div class="brand"><div class="logo">AI</div><div><h1>RA ĐỀ KIỂM TRA AI – 3 CẤP</h1><p>Tiểu học • THCS • THPT • Mọi môn học</p></div></div>
 <div class="top-actions">
  <button class="tbtn" data-act="openBank">📚 Ngân hàng câu hỏi</button>
  <button class="tbtn" data-act="openSaved">🗂 Đề đã lưu</button>
  <button class="tbtn" data-act="restoreCfg">↺ Khôi phục cấu hình gần nhất</button>
  <button class="tbtn" data-act="clearCfg">🗑 Xóa toàn bộ cấu hình</button>
 </div>
</header>
<main class="layout">
 <aside class="panel" id="setup">
  <div class="stepper" id="stepper"></div>
  <div class="stepbody" id="stepbody"></div>
  <div class="panel-foot">
   <div class="navrow"><button class="btn" data-act="prevStep">← Trước</button><button class="btn" data-act="nextStep">Tiếp →</button></div>
   <button class="btn" data-act="makeMatrix">📊 Tạo ma trận</button>
   <button class="bigbtn" id="genBtn" data-act="generate">✨ TẠO ĐỀ KIỂM TRA</button>
  </div>
 </aside>
 <section class="preview">
  <div class="summary" id="summary"></div>
  <div class="ptoolbar">
   <div class="tg"><button class="btn sm" data-act="regenAll">🔄 Tạo lại</button><button class="btn sm" data-act="equivalent">🧬 Tạo đề tương đương</button><button class="btn sm" data-act="verifyExam">🔍 Kiểm tra đề</button></div>
   <div class="tg"><button class="btn sm" data-act="saveExam">💾 Lưu</button><button class="btn sm" data-act="copyExam">📋 Sao chép</button><button class="btn sm" data-act="exportMenu">⬇ Xuất ▾</button><button class="btn sm" data-act="printExam">🖨 In</button></div>
   <div class="tg end"><button class="btn sm" data-act="undo">↩ Hoàn tác</button><button class="btn sm" data-act="history">🕘 Lịch sử</button><button class="btn sm danger" data-act="clearExam">🗑 Xóa</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pcontent" id="pcontent"></div>
 </section>
</main>
<footer class="foot">Đề được AI hỗ trợ tạo. Giáo viên cần kiểm duyệt nội dung, đáp án và mức độ phù hợp trước khi sử dụng chính thức.</footer>
</div>
<div id="printArea"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
/* ============ 1. DỮ LIỆU CẤU HÌNH TĨNH ============ */
const LEVELS=[{k:'nb',n:'Nhận biết'},{k:'th',n:'Thông hiểu'},{k:'vd',n:'Vận dụng'},{k:'vdc',n:'Vận dụng cao'}];
const LV=Object.fromEntries(LEVELS.map(l=>[l.k,l.n]));
const TYPES={
 mc4:{n:'Trắc nghiệm 4 lựa chọn',sec:'TRẮC NGHIỆM NHIỀU LỰA CHỌN',w:1,o:1,a:1,ins:'Thí sinh chọn một phương án đúng nhất cho mỗi câu.'},
 mcMulti:{n:'Trắc nghiệm nhiều đáp án đúng',sec:'TRẮC NGHIỆM NHIỀU ĐÁP ÁN ĐÚNG',w:1.5,o:2,a:4,ins:'Mỗi câu có thể có nhiều đáp án đúng. Thí sinh chọn tất cả các đáp án đúng.'},
 tf:{n:'Đúng/Sai',sec:'TRẮC NGHIỆM ĐÚNG/SAI',w:2,o:3,a:5,ins:'Trong mỗi ý a), b), c), d) ở mỗi câu, thí sinh chọn Đúng hoặc Sai.'},
 match:{n:'Ghép nối',sec:'GHÉP NỐI',w:1.5,o:4,a:3,ins:'Ghép mỗi nội dung ở cột bên trái với một nội dung phù hợp ở cột bên phải.'},

function allocScores(items,sc,step,mode,parts){
 const units=Math.round(sc/step);let u;
 if(mode==='equal')u=distUnits(units,items.map(()=>1));
 else if(mode==='part'){
  const types=[...new Set(items.map(s=>s.type))];const totW=items.reduce((a,s)=>a+TYPES[s.type].w,0)||1;
  const budgets=types.map(t=>{const p=+(parts&&parts[t])||0;if(p>0)return p;return sc*TYPES[t].w*items.filter(s=>s.type===t).length/totW});
  const bu=lrm(units,budgets);u=items.map(()=>0);
  types.forEach((t,ti)=>{const idx=items.map((s,i)=>s.type===t?i:-1).filter(i=>i>=0);const d=distUnits(bu[ti],idx.map(i=>wOfItem(items[i])));idx.forEach((i,k)=>u[i]=d[k])})}

function buildPlan(c){
 let raw=[];const errs=[];
 const kinds=[];ESSAY.forEach(e=>{for(let i=0;i<(+c.essay[e[0]]||0);i++)kinds.push(e)});
 const fromMatrix=!!(c.matrixLock&&c.matrixRows&&c.matrixRows.length);

 }else{
  Object.keys(c.counts).forEach(t=>{for(let i=0;i<(+c.counts[t]||0);i++)raw.push({type:t,kind:'',kw:0})});
  kinds.forEach(k=>raw.push({type:'essay',kind:k[1],kw:k[2]}));
  const total=raw.length;if(!total)errs.push('Chưa chọn số câu cho dạng câu hỏi nào.');

  const order=diffOrder(raw);const lv=[];LEVELS.forEach(l=>{for(let i=0;i<lc.counts[l.k];i++)lv.push(l.k)});
  order.forEach((idx,k)=>{raw[idx].level=lv[k]||'nb'});
  const tp=topicsOf(c);let target;
  if(c.topicMode==='manual'&&tp.length>1){target=tp.map(t=>+c.topicQ[t]||0);const sm=target.reduce((a,b)=>a+b,0);if(sm!==total){errs.push(`Tổng số câu theo chủ đề (${sm}) khác tổng số câu của đề (${total}).`);target=lrm(total,tp.map(()=>1))}}
  else target=lrm(total,tp.map(()=>1));
  const rem=target.slice();
  order.forEach(idx=>{let bi=0,br=-Infinity;rem.forEach((r,ti)=>{const ratio=target[ti]?r/target[ti]:-1;if(ratio>br){br=ratio;bi=ti}});raw[idx].topic=tp[bi];rem[bi]--});
 }
 if(!raw.length&&!errs.length)errs.push('Chưa có câu hỏi nào trong cấu hình.');
 raw.sort((a,b)=>TYPES[a.type].o-TYPES[b.type].o);
 const sc=scaleOf(c),step=stepFor(sc,raw.length);
 const u=allocScores(raw,sc,step,c.scoreMode,c.partScores);
 raw.forEach((s,i)=>{s.id='Q'+String(i+1).padStart(2,'0');s.score=u[i]});
 return{slots:raw,errs,step,scale:sc}}
function rebalanceScores(ex){
 const qs=ex.questions,sc=ex.meta.scale,step=stepFor(sc,qs.length);ex.step=step;
 const ord=qs.slice().sort((a,b)=>TYPES[a.type].o-TYPES[b.type].o);
 const u=allocScores(ord,sc,step,ex.scoreMode||'weight',ex.partScores);ord.forEach((q,i)=>setScore(q,u[i],step))}
function rubricFrom(items,score,step){
 let it=(items||[]).map(x=>({content:str(x.content||x.text),w:Math.max(+(x.weight??x.score??1)||1,0.0001)})).filter(x=>x.content);
 if(!it.length)return[];
 const st=Math.abs(score/step-Math.round(score/step))<1e-6?step:0.05;
 const units=Math.max(1,Math.round(score/st));
 if(it.length>units){const keep=it.slice(0,units-1);const rest=it.slice(units-1);keep.push({content:rest.map(x=>x.content).join('; '),w:rest.reduce((a,b)=>a+b.w,0)});it=keep}
 const u=distUnits(units,it.map(x=>x.w));return it.map((x,i)=>({content:x.content,score:r3(u[i]*st),weight:x.w}))}
function setScore(q,score,step){q.score=score;if(q.type==='essay'&&q.rubric?.length)q.rubric=rubricFrom(q.rubric.map(r=>({content:r.content,weight:r.weight||r.score||1})),score,step||0.25)}

const stripOpt=s=>str(s).replace(/^\s*[A-Da-d][\.\)\:]\s+/,'');

function normQ(r,slot){

  score:slot.score,locked:false,uncertain:!!r.uncertain,uncertainNote:str(r.uncertainNote),src:'ai'};

 if(q.type==='mc4'||q.type==='mcMulti'){
  q.options=(Array.isArray(r.options)?r.options:[]).slice(0,4).map(stripOpt);while(q.options.length<4)q.options.push('');
  if(q.type==='mc4'){let s=str(Array.isArray(ca)?ca[0]:ca);let L=(s.match(/^\(?([A-Da-d])\)?(?:[\.\):\s]|$)/)||[])[1];if(!L){const i=q.options.findIndex(o=>o&&o.toLowerCase()===stripOpt(s).toLowerCase());if(i>=0)L=LET[i]}q.correctAnswer=(L||'').toUpperCase()}
  else{const s=Array.isArray(ca)?ca.join(','):str(ca);q.correctAnswer=[...new Set((s.toUpperCase().match(/[A-D]/g)||[]))].sort().join(',')}
 }else if(q.type==='tf'){
  q.options=(Array.isArray(r.options)?r.options:[]).slice(0,4).map(s=>str(s).replace(/^\s*[a-dA-D][\)\.]\s*/,''));while(q.options.length<4)q.options.push('');
  const arr=Array.isArray(ca)?ca:(str(ca).match(/đúng|sai|true|false|Đ|S/gi)||[]);

 }else if(q.type==='match'){
  q.pairs=(Array.isArray(r.pairs)?r.pairs:[]).map(p=>({left:str(p.left),right:str(p.right)})).filter(p=>p.left&&p.right).slice(0,6);
  q.rightOrder=makeRight(q.pairs,q.id+q.question);
 }else if(q.type==='fill'||q.type==='short'){q.correctAnswer=str(ca)}
 else{q.correctAnswer=str(ca);q.rubric=rubricFrom(r.rubric,q.score,0.25)}

const BLANK=/(…+|_{3,}|\.{4,}|\[\s*\])/;
const numLike=s=>/^[\-−+(]?\s*(\d|√|π|½|⅓|¼|¾)/.test(String(s).trim());
const words=s=>new Set(String(s).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean));
function validateQ(q){
 const e=[],w=[];
 if(q.empty){e.push('Chưa có nội dung');return{e,w}}
 if(!q.question)e.push('Thiếu nội dung câu hỏi');
 if(q.type==='mc4'||q.type==='mcMulti'){
  if(q.options.some(o=>!o))e.push('Thiếu phương án');
  const lo=q.options.map(o=>o.toLowerCase());if(new Set(lo).size<lo.length)e.push('Có phương án trùng nhau');
  if(q.type==='mc4'&&!/^[A-D]$/.test(q.correctAnswer))e.push('Đáp án không hợp lệ');
  if(q.type==='mcMulti'){if(!q.correctAnswer)e.push('Chưa có đáp án đúng');else if(q.correctAnswer.split(',').length<2)w.push('Dạng nhiều đáp án nhưng chỉ có 1 đáp án đúng')}
  const ci=q.type==='mc4'?LET.indexOf(q.correctAnswer):-1;
  if(ci>=0&&q.options[ci]){const c=q.options[ci];
   if(numLike(c)&&q.options.some(o=>o&&!numLike(o)))e.push('Phương án nhiễu khác kiểu dữ liệu với đáp án (kết quả số)');
   if(c.length>=6&&q.question.toLowerCase().includes(c.toLowerCase()))w.push('Đáp án có thể bị lộ trong câu hỏi')}
 }else if(q.type==='tf'){
  if(q.options.some(o=>!o))e.push('Thiếu mệnh đề');
  const t=q.correctAnswer.split(',').filter(Boolean);if(t.length!==4)e.push('Đáp án Đúng/Sai phải đủ 4 ý');
 }else if(q.type==='match'){
  if(q.pairs.length<3)e.push('Cần tối thiểu 3 cặp ghép nối');
  if(new Set(q.pairs.map(p=>p.right.toLowerCase())).size<q.pairs.length)e.push('Có vế phải trùng nhau');
 }else if(q.type==='fill'){
  if(!BLANK.test(q.question))w.push('Không thấy chỗ trống (……) trong câu');
  if(!q.correctAnswer)e.push('Thiếu đáp án');
 }else if(q.type==='short'){if(!q.correctAnswer)e.push('Thiếu đáp án')}
 else{if(!q.correctAnswer)e.push('Thiếu đáp án/gợi ý trả lời');if(!q.rubric?.length)e.push('Thiếu hướng dẫn chấm')}
 return{e,w}}

const NOSHUF=/(cả\s+[a-d]|tất cả|các đáp án|đáp án nào|không có|ý trên|phương án trên|\b[a-d]\s*(và|,)\s*[a-d]\b)/i;
function variantOf(code){
 const ex=S.exam;let qs=ex.questions.map(clone);const base=code===101;
 const r=mulberry(code*7919+13);
 const types=Object.keys(TYPES).sort((a,b)=>TYPES[a].o-TYPES[b].o);
 let out=[];
 types.forEach(t=>{let g=qs.filter(q=>q.type===t);if(!base&&ex.shuffleQ)g=shuffleArr(g,r);out=out.concat(g)});
 if(!base)out.forEach(q=>{
  if(q.type==='match'&&ex.shuffleO){q.rightOrder=makeRight(q.pairs,q.id+q.question+code)}
  if(!ex.shuffleO||q.locked)return;
  if(q.type==='mc4'||q.type==='mcMulti'){
   if(q.options.some(o=>NOSHUF.test(o)))return;

async function runBatch(b,x,avoid,extra,out,bad){
 checkAbort();
 try{
  const res=await aiJson(buildGenPrompt(b,x,avoid,extra),x.cat==='calc'?'complex':'default');
  const arr=Array.isArray(res)?res:(res.questions||[]);
  arr.forEach(r=>{const sl=b.find(s=>s.id===String(r.id));if(sl&&!out[sl.id]){out[sl.id]=normQ(r,sl);if(liveFn)liveFn(sl.id,out[sl.id])}});
  (res.insufficient||[]).forEach(i=>{bad[i.id]=str(i.reason)||'Không đủ dữ liệu trong tài liệu để ra câu này.'});
  b.forEach(s=>{if(!out[s.id]&&!bad[s.id])bad[s.id]='AI không trả về câu này.'});
 }catch(e){
  if(e&&(e.code==='cancelled'||e.code==='not_granted'||e.code==='no_ai'))throw e;
  if(b.length>1){for(const s of b)await runBatch([s],x,avoid,extra,out,bad)}
  else bad[b[0].id]='Lỗi AI: '+((e&&(e.message||e.code))||'không rõ')}}

 q.ai={checked:true,answerOk:r.answerCorrect!==false,inScope:r.inScope!==false,missing:!!r.missingData,ambiguous:!!r.ambiguous,spelling:[],note:str(r.note),yourAnswer:str(r.yourAnswer)};
 (r.spellingFixes||[]).forEach(f=>{const a=str(f.from),b=str(f.to);if(!a||!b||a===b)return;q.ai.spelling.push(a+' → '+b);if(q.locked)return;
  ['question','explanation','correctAnswer'].forEach(k=>{if(q[k]&&q[k].includes(a)&&(k!=='correctAnswer'||q.type==='fill'||q.type==='short'))q[k]=q[k].split(a).join(b)});q.options=q.options.map(o=>o.split(a).join(b));q.pairs.forEach(p=>{p.left=p.left.split(a).join(b);p.right=p.right.split(a).join(b)})})}

function parseTeacher(text){
 if(!text.trim())return[];
 return text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).map(b=>{
  const lines=b.split('\n').map(l=>l.trim()).filter(Boolean);let ans='',expl='',stem=[],opts=[],st=[];
  lines.forEach(l=>{let m;
   if((m=l.match(/^(đáp án|dap an|đ\/a|answer)\s*[:：]\s*(.+)$/i)))ans=m[2].trim();
   else if((m=l.match(/^(giải thích|hướng dẫn|lời giải|hdc)\s*[:：]\s*(.+)$/i)))expl=m[2].trim();
   else if((m=l.match(/^([A-D])[\.\)]\s*(.+)$/)))opts.push(m[2].trim());
   else if((m=l.match(/^([a-d])[\.\)]\s*(.+)$/)))st.push(m[2].trim());
   else stem.push(l)});
  let question=stem.join('\n').replace(/^câu\s*\d+\s*[\.:\)]?\s*/i,'');
  const L=(ans.toUpperCase().match(/[A-D]/g)||[]);
  let t,q={question,options:[],correctAnswer:ans,explanation:expl};
  if(opts.length>=3){while(opts.length<4)opts.push('');q.options=opts.slice(0,4);t=[...new Set(L)].length>1?'mcMulti':'mc4';q.correctAnswer=[...new Set(L)].sort().join(',')}
  else if(st.length>=3&&/(đ|s|đúng|sai)/i.test(ans)){t='tf';while(st.length<4)st.push('');q.options=st.slice(0,4);q.correctAnswer=(ans.match(/đúng|sai|Đ|S/gi)||[]).map(v=>/^(đ|đúng)$/i.test(v)?'Đ':'S').join(',')}
  else if(BLANK.test(question)&&ans&&ans.length<60)t='fill';
  else if(ans&&ans.length<40&&!/\n/.test(ans)&&question.length<400&&!/(trình bày|giải thích|phân tích|chứng minh|so sánh|viết)/i.test(question))t='short';
  else t='essay';
  return{type:t,q}})}

async function runPipeline(slots,opts){
 const c=S.cfg,x=ctxInfo(c),P=showProg();
 let qs={};let notes=[];
 try{
  P.set(0);await sleep(250);
  const sm=await getSample();
  if(!sm)notes.push('AI chưa khả dụng – các câu chưa có nội dung được để trống để bạn tự nhập.');
  P.set(1);await sleep(250);
  // câu giáo viên nhập
  const lockedIds=new Set();
  (opts.fixed||[]).forEach(f=>{qs[f.id]=f;lockedIds.add(f.id)});
  const todo=slots.filter(s=>!qs[s.id]);
  const avoid=[...(opts.avoid||[]),...Object.values(qs).map(q=>q.question)];
  P.set(2,`Đang soạn ${todo.length} câu…`);
  let bad={};
  if(sm&&todo.length){const r=await genSlots(todo,x,avoid,opts.extra);Object.assign(qs,r.out);bad=r.bad}
  else todo.forEach(s=>bad[s.id]='AI chưa khả dụng.');
  // sửa lỗi cấu trúc
  for(let round=0;round<2&&sm;round++){
   checkAbort();
   const fix=slots.filter(s=>!lockedIds.has(s.id)&&(!qs[s.id]||validateQ(qs[s.id]).e.length)&&!/Không đủ|tài liệu/i.test(bad[s.id]||''));
   if(!fix.length)break;
   P.set(2,`Đang sửa ${fix.length} câu chưa đạt…`);
   const r=await genSlots(fix,x,[...avoid,...Object.values(qs).map(q=>q.question)],'Lưu ý: lần soạn trước bị lỗi cấu trúc/đáp án, hãy soạn lại thật cẩn thận.');
   Object.assign(qs,r.out);Object.assign(bad,r.bad);Object.keys(r.out).forEach(k=>delete bad[k])}
  slots.forEach(s=>{if(!qs[s.id]||(validateQ(qs[s.id]).e.length&&!lockedIds.has(s.id)))qs[s.id]=blankQ(s,bad[s.id]||'Chưa tạo được câu hợp lệ.')});
  // kiểm tra bằng AI
  let list=slots.map(s=>qs[s.id]);
  if(sm){
   P.set(3,'Đang tự giải lại và đối chiếu đáp án…');
   await aiVerify(list,x);
   for(let round=0;round<2;round++){
    const fail=list.filter(q=>!q.locked&&!q.empty&&aiFail(q));
    if(!fail.length)break;
    checkAbort();P.set(3,`Đang sửa ${fail.length} câu AI phát hiện chưa đạt…`);
    const fs=fail.map(q=>slots.find(s=>s.id===q.id));
    const r=await genSlots(fs,x,[...avoid,...list.map(q=>q.question)],'Lưu ý: câu trước bị phát hiện sai đáp án/thiếu dữ kiện/mơ hồ. Hãy soạn lại chính xác.');
    const nw=Object.values(r.out).filter(q=>!validateQ(q).e.length);
    nw.forEach(q=>qs[q.id]=q);list=slots.map(s=>qs[s.id]);
    await aiVerify(nw,x)}
  }
  P.set(4,'Đang hoàn thiện đề…');
  list.forEach(q=>{
   if(aiFail(q)){q.uncertain=true;q.uncertainNote=q.uncertainNote||q.ai.note||'Kiểm tra bằng AI phát hiện vấn đề.'}
   const v=validateQ(q);if(v.w.length&&!q.empty){q.uncertain=true;q.uncertainNote=q.uncertainNote||v.w.join('; ')}
   if(!q.explanation&&!q.empty&&q.type!=='essay')q.explanation='Đáp án đúng: '+ansText(q)+'.';
   q.subject=subjectOf(c);q.grade=c.grade;q.schoolLevel=c.level});
  await sleep(250);P.close();return{questions:list,notes};
 }catch(e){P.close();throw e}}

/* ============ 9. KIỂM TRA ĐỀ (12 mục) ============ */
function runChecks(ex){
 const qs=ex.questions,t=tally(qs),tg=ex.target,ck=[];
 const add=(n,title,st,detail)=>ck.push({n,title,st,detail});
 const ai=qs.some(q=>q.ai?.checked);
 add(1,'Số câu có đúng cấu hình không?',t.total===tg.total?'ok':'fail',`Đề có ${t.total} câu, cấu hình ${tg.total} câu.`);
 add(2,'Tổng điểm có đúng không?',Math.abs(t.score-ex.meta.scale)<0.005?'ok':'fail',`Tổng điểm ${fmt(t.score)} / thang ${fmt(ex.meta.scale)}.`);
 const lvOk=LEVELS.every(l=>t.byLevel[l.k]===tg.byLevel[l.k]);
 add(3,'Tỷ lệ mức độ có đúng không?',lvOk?'ok':'fail',LEVELS.map(l=>`${l.n}: ${t.byLevel[l.k]}/${tg.byLevel[l.k]}`).join(' • '));
 const dup=[];for(let i=0;i<qs.length;i++)for(let j=i+1;j<qs.length;j++){if(qs[i].empty||qs[j].empty)continue;const a=words(qs[i].question),b=words(qs[j].question);if(a.size<4||b.size<4)continue;let inter=0;a.forEach(w=>{if(b.has(w))inter++});if(inter/(a.size+b.size-inter)>0.8)dup.push(`${qs[i].id} ≈ ${qs[j].id}`)}
 add(4,'Có câu bị trùng không?',dup.length?'warn':'ok',dup.length?'Nghi trùng: '+dup.join(', '):'Không phát hiện câu trùng.');
 const sErr=qs.map(q=>({id:q.id,v:validateQ(q)})).filter(o=>o.v.e.length);
 const aFail=qs.filter(aiFail);
 add(5,'Đáp án có chính xác không?',sErr.length||aFail.length?'fail':(ai?'ok':'warn'),sErr.length||aFail.length?[...sErr.map(o=>`${o.id}: ${o.v.e.join(', ')}`),...aFail.filter(q=>q.ai.answerOk===false).map(q=>`${q.id}: AI giải ra "${q.ai.yourAnswer}" – ${q.ai.note}`)].join(' | ')||'Có câu bị AI đánh dấu.':(ai?'AI đã tự giải lại toàn bộ câu và đối chiếu đáp án.':'Chưa kiểm tra bằng AI (chỉ kiểm tra cấu trúc).'));
 const sc=qs.filter(q=>q.ai&&q.ai.inScope===false);
 add(6,'Câu hỏi có đúng môn/lớp không?',sc.length?'warn':(ai?'ok':'warn'),sc.length?sc.map(q=>q.id+': '+q.ai.note).join(' | '):(ai?'Không phát hiện câu sai môn/lớp.':'Chưa kiểm tra bằng AI.'));
 add(7,'Có nội dung ngoài phạm vi không?',sc.length?'warn':(ai?'ok':'warn'),sc.length?sc.map(q=>q.id).join(', ')+' có thể ngoài phạm vi.':(ai?'Mọi câu nằm trong phạm vi đã quy định.':'Chưa kiểm tra bằng AI.'));
 const ms=qs.filter(q=>q.ai?.missing||q.ai?.ambiguous||q.empty);
 add(8,'Có câu thiếu dữ kiện/mơ hồ không?',ms.length?'fail':(ai?'ok':'warn'),ms.length?ms.map(q=>q.id+(q.empty?' (trống)':'')).join(', '):(ai?'Không phát hiện.':'Chưa kiểm tra bằng AI.'));
 const sp=qs.filter(q=>q.ai?.spelling?.length);
 add(9,'Có lỗi chính tả không?',sp.length?'warn':(ai?'ok':'warn'),sp.length?'Đã tự sửa: '+sp.map(q=>q.id+' ('+q.ai.spelling.join('; ')+')').join(' | '):(ai?'Không phát hiện lỗi chính tả.':'Chưa kiểm tra bằng AI.'));
 const m=buildMatrix(qs);const mOk=m.total===qs.length&&Math.abs(m.score-t.score)<0.005&&LEVELS.every(l=>m.lv[l.k].n===t.byLevel[l.k]);
 add(10,'Ma trận có khớp với đề không?',mOk?'ok':'fail',`Ma trận: ${m.total} câu, ${fmt(m.score)} điểm.`);
 const ansBad=qs.filter(q=>!q.empty&&(validateQ(q).e.length));
 add(11,'Đáp án có khớp với câu hỏi không?',ansBad.length?'fail':'ok',ansBad.length?ansBad.map(q=>q.id).join(', '):'Mỗi câu đều có đáp án đúng định dạng, khớp dạng câu.');
 const hd=qs.filter(q=>q.type==='essay'&&(!q.rubric.length||Math.abs(q.rubric.reduce((a,r)=>a+r.score,0)-q.score)>0.005));
 const noAns=qs.filter(q=>!q.empty&&!q.correctAnswer&&q.type!=='match');
 add(12,'Hướng dẫn chấm có đủ không?',hd.length||noAns.length?'fail':'ok',hd.length||noAns.length?[...hd.map(q=>q.id+': thang điểm ý không bằng điểm câu'),...noAns.map(q=>q.id+': thiếu đáp án')].join('; '):'Mọi câu đều có đáp án/hướng dẫn; điểm thành phần cộng đúng bằng điểm câu.');
 return ck}
function autoFixLocal(ex){
 // tự sửa: điểm lệch (nếu chưa chỉnh tay) và rubric lệch
 if(!ex.manualScores&&Math.abs(sumScore(ex.questions)-ex.meta.scale)>0.005)rebalanceScores(ex);
 ex.questions.forEach(q=>{if(q.type==='essay'&&q.rubric?.length){const s=q.rubric.reduce((a,r)=>a+r.score,0);if(Math.abs(s-q.score)>0.005)q.rubric=rubricFrom(q.rubric.map(r=>({content:r.content,weight:r.weight||r.score})),q.score,ex.step||0.25)}});}

/* ============ 10. MA TRẬN / ĐẶC TẢ ============ */
function buildMatrix(items){
 const topics=[...new Set(items.map(i=>i.topic))];const lv={};LEVELS.forEach(l=>lv[l.k]={n:0,s:0});
 const rows=topics.map(tp=>{const cell={};LEVELS.forEach(l=>cell[l.k]={n:0,s:0,nums:[]});let n=0,s=0;
  items.filter(i=>i.topic===tp).forEach(i=>{const c=cell[i.level];c.n++;c.s=r3(c.s+i.score);if(i.num)c.nums.push(i.num);n++;s=r3(s+i.score);lv[i.level].n++;lv[i.level].s=r3(lv[i.level].s+i.score)});
  return{topic:tp,cell,n,s}});
 return{rows,lv,total:items.length,score:r3(items.reduce((a,i)=>a+i.score,0))}}
function matrixHtml(m,scale){
 const pc=s=>m.score?fmt(s/m.score*100)+'%':'0%';
 const cell=(c)=>c.n?`<td class="c cell">${c.n} câu<small>${fmt(c.s)} đ</small><small>${pc(c.s)}</small>${c.nums.length?`<small>(Câu ${c.nums.join(', ')})</small>`:''}</td>`:'<td class="c cell">–</td>';
 return `<div class="tw"><table class="t"><thead><tr><th>Chủ đề/Nội dung</th>${LEVELS.map(l=>`<th>${l.n}</th>`).join('')}<th>Tổng</th></tr></thead><tbody>
 ${m.rows.map(r=>`<tr><td>${esc(r.topic)}</td>${LEVELS.map(l=>cell(r.cell[l.k])).join('')}<td class="c cell"><b>${r.n} câu</b><small>${fmt(r.s)} đ</small><small>${pc(r.s)}</small></td></tr>`).join('')}
 <tr class="rowtot"><td>Tổng số câu</td>${LEVELS.map(l=>`<td class="c">${m.lv[l.k].n}</td>`).join('')}<td class="c">${m.total}</td></tr>
 <tr class="rowtot"><td>Tổng điểm</td>${LEVELS.map(l=>`<td class="c">${fmt(m.lv[l.k].s)}</td>`).join('')}<td class="c">${fmt(m.score)}</td></tr>
 <tr class="rowtot"><td>Tỷ lệ từng mức độ (theo điểm)</td>${LEVELS.map(l=>`<td class="c">${pc(m.lv[l.k].s)}</td>`).join('')}<td class="c">${m.score?'100%':'0%'}</td></tr>
 <tr class="rowtot"><td>Tỷ lệ từng mức độ (theo số câu)</td>${LEVELS.map(l=>`<td class="c">${m.total?fmt(m.lv[l.k].n/m.total*100):0}%</td>`).join('')}<td class="c">100%</td></tr>
 </tbody></table></div>`}
function typeTable(items){const g={};items.forEach(i=>{g[i.type]=g[i.type]||{n:0,s:0};g[i.type].n++;g[i.type].s=r3(g[i.type].s+i.score)});
 return `<table class="t"><thead><tr><th>Dạng câu hỏi</th><th>Số câu</th><th>Số điểm</th></tr></thead><tbody>${Object.keys(TYPES).filter(t=>g[t]).map(t=>`<tr><td>${TYPES[t].n}</td><td class="c">${g[t].n}</td><td class="c">${fmt(g[t].s)}</td></tr>`).join('')}</tbody></table>`}

function openModal({title,body,actions=[],wide,static:st,onMount}){
 const back=document.createElement('div');back.className='modal-back';
 back.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><span>${esc(title)}</span>${st?'':'<button class="btn sm" data-x>✕</button>'}</div><div class="mb">${body}</div><div class="mf"></div></div>`;

 actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;b.onclick=async()=>{const r=await a.onClick?.(back,close);if(r===true)close()};mf.appendChild(b)});

function onField(e,type){
 const el=e.target;
 if(el.id==='fileDocs'&&type==='change'){handleFiles(el.files,'docs');el.value='';return}
 if(el.id==='fileMatrix'&&type==='change'){handleFiles(el.files,'matrix');el.value='';return}
 if(el.id==='verSel'&&type==='change'){S.ver=+el.value;renderPreview();return}
 if(el.dataset&&el.dataset.tq!==undefined&&el.closest('#setup')){if(type==='input'){S.cfg.topicQ[el.dataset.tq]=Math.max(0,parseInt(el.value)||0);refreshLive();saveDraft()}return}
 const k=el.dataset?.k;if(!k||!el.closest('#setup'))return;
 const textual=el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&['text','number'].includes(el.type));
 if(textual&&type!=='input')return;if(!textual&&type!=='change')return;
 if(el.type==='radio'&&!el.checked)return;
 let v=el.type==='checkbox'?el.checked:el.value;
 if(el.hasAttribute('data-int'))v=Math.max(0,parseInt(v)||0);else if(el.type==='number')v=Math.max(0,parseFloat(v)||0);
 setp(S.cfg,k,v);
 if(k==='versions'&&S.exam){S.exam.versions=+v;renderPreview();persistExam()}
 if(k==='matrixText'||k.startsWith('counts.')||k.startsWith('essay.')){if(S.cfg.matrixLock&&k!=='matrixText'){S.cfg.matrixLock=false;toast('Đã bỏ khóa ma trận tải lên do bạn chỉnh số câu.')}}
 if(el.hasAttribute('data-re'))renderSetup();else refreshLive();
 saveDraft()}

async function fileText(f){
 const n=f.name.toLowerCase();
 if(f.type.startsWith('image/')){const sm=await getSample();if(!sm||!_lim?.images)throw new Error('Môi trường này chưa hỗ trợ đọc hình ảnh – hãy dán nội dung văn bản vào ô bên dưới.');
  const r=await sm('Hãy chép lại CHÍNH XÁC toàn bộ văn bản, công thức, bảng biểu trong hình (tiếng Việt). Không bình luận thêm.',{images:[f],modelTier:'quick',cache:false});return r.text}
 if(n.endsWith('.pdf')){if(!window.pdfjsLib)throw new Error('Không tải được thư viện đọc PDF – hãy dán nội dung vào ô bên dưới.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let t='';
  for(let i=1;i<=Math.min(pdf.numPages,80);i++){const p=await pdf.getPage(i);const tc=await p.getTextContent();t+=tc.items.map(x=>x.str).join(' ')+'\n'}
  if(t.replace(/\s/g,'').length<30)throw new Error('PDF không có lớp chữ (có thể là bản scan). Hãy tải dưới dạng hình ảnh hoặc dán nội dung.');return t}
 if(n.endsWith('.docx')){if(!window.mammoth)throw new Error('Không tải được thư viện đọc Word – hãy dán nội dung.');return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
 if(n.endsWith('.doc'))throw new Error('Chưa đọc được file .doc cũ – hãy lưu lại thành .docx hoặc dán nội dung.');
 return await f.text()}
async function handleFiles(files,target){

   if(!t){toast('Không đọc được nội dung: '+f.name);continue}
   if(target==='docs'){S.cfg.docs.push({name:f.name,kind:S.cfg.docKind,text:t});const l=$('#docList');if(l)l.innerHTML=docListHtml()}
   else{S.cfg.matrixText=(S.cfg.matrixText?S.cfg.matrixText+'\n':'')+t;renderSetup()}
   toast('Đã đọc '+f.name);saveDraft()}
  catch(e){alertBox('Không đọc được tệp',`<p><b>${esc(f.name)}</b>: ${esc(e.message||String(e))}</p>`)}}}

MA TRẬN:
${c.matrixText.slice(0,Math.min(20000,maxRef()))}
Chỉ trả về JSON: {"rows":[...]}`,'default');

const XMLNS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
const xe=s=>String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function runXml(r){
 if(r.br)return '<w:r><w:br/></w:r>';
 if(r.tab)return '<w:r><w:tab/></w:r>';
 const pr=(r.b?'<w:b/>':'')+(r.i?'<w:i/>':'')+(r.sz?`<w:sz w:val="${r.sz}"/>`:'');
 return String(r.t).split('\n').map((p,k)=>(k?'<w:r><w:br/></w:r>':'')+(p===''?'':`<w:r>${pr?`<w:rPr>${pr}</w:rPr>`:''}<w:t xml:space="preserve">${xe(p)}</w:t></w:r>`)).join('')}
function paraXml(runs,o={}){
 const tabs=o.tabs?`<w:tabs>${o.tabs.map(p=>`<w:tab w:val="${o.tabVal||'left'}" w:pos="${p}"/>`).join('')}</w:tabs>`:'';
 return `<w:p><w:pPr>${o.keep?'<w:keepNext/>':''}${tabs}<w:spacing w:before="${o.before||0}" w:after="${o.after??60}"/>${o.ind?`<w:ind w:left="${o.ind}"/>`:''}${o.align?`<w:jc w:val="${o.align}"/>`:''}</w:pPr>${runs}</w:p>`}
function inlineRuns(n,st,buf){
 n.childNodes.forEach(c=>{
  if(c.nodeType===3){let t=c.nodeValue;if(!st.pre)t=t.replace(/\s+/g,' ');if(t!=='')buf.push(Object.assign({t},st.b?{b:1}:{},st.i?{i:1}:{},st.sz?{sz:st.sz}:{}))}
  else if(c.nodeType===1){if(c.classList.contains('no-print'))return;const tg=c.tagName;if(tg==='BR'){buf.push({br:1});return}
   const s=Object.assign({},st);if(tg==='B'||tg==='STRONG')s.b=1;if(tg==='I'||tg==='EM')s.i=1;if(tg==='SMALL')s.sz=20;inlineRuns(c,s,buf)}})}
const INLINE=['B','I','STRONG','EM','SPAN','A','U'];
function walkBlocks(el,out,ctx){
 ctx=ctx||{};let buf=[];
 const flush=()=>{if(buf.some(r=>r.br||r.tab||(r.t&&r.t.trim()!==''))){out.push(paraXml(buf.map(r=>runXml(ctx.bold&&r.t!==undefined?Object.assign({},r,{b:1}):r)).join(''),ctx.p||{}))}buf=[]};
 el.childNodes.forEach(c=>{
  if(c.nodeType===3){let t=c.nodeValue;if(!ctx.pre)t=t.replace(/\s+/g,' ');if(t!=='')buf.push({t});return}
  if(c.nodeType!==1||c.classList.contains('no-print'))return;
  const tg=c.tagName,cl=c.classList;
  if(INLINE.includes(tg)){const s={};inlineRuns({childNodes:[c]},{pre:ctx.pre},buf);return}
  if(tg==='BR'){buf.push({br:1});return}
  flush();
  if(tg==='SMALL'){out.push(paraXml(runXml({t:c.textContent.trim(),sz:20,i:cl.contains('x')?0:1}),Object.assign({},ctx.p||{},{after:20})));return}
  if(tg==='TABLE'){out.push(tableXml(c));out.push(paraXml('',{after:60}));return}

 let c0=0;

  x+='<w:tr>';let col=0;
  line.forEach(cell=>{
   const cs=cell.cs||cell.span||1;const idx=cell.cont?col:cell.col;const w=colW.slice(idx,idx+cs).reduce((a,b)=>a+b,0);

   if(isH)pr+='<w:shd w:val="clear" w:color="auto" w:fill="D9E2F3"/>';else if(td.parentNode.classList.contains('rowtot'))pr+='<w:shd w:val="clear" w:color="auto" w:fill="F3F6FC"/>';
   const ps=[];const cx={bold:isH||td.parentNode.classList.contains('rowtot'),pre:td.classList.contains('qt'),p:{after:20,align:(isH||td.classList.contains('c'))?'center':null}};
   walkBlocks(td,ps,cx);if(!ps.length)ps.push('<w:p/>');
   x+=`<w:tc><w:tcPr>${pr}</w:tcPr>${ps.join('')}</w:tc>`;col+=cs});
  x+='</w:tr>'});
 return x+'</w:tbl>'}

function validateCfg(){
 const c=S.cfg,e=[];
 if(!c.level)e.push('Chưa chọn cấp học.');else if(!c.grade)e.push('Chưa chọn lớp.');
 if(!subjectOf(c))e.push('Chưa chọn hoặc nhập môn học.');
 if(c.sourceMode==='ref'&&!c.docs.length&&!c.refText.trim())e.push('Bạn chọn “Chỉ sử dụng tài liệu tải lên” nhưng chưa tải/dán tài liệu.');
 if(c.sourceMode==='teacher'&&!(c.content.trim()||c.topic.trim()||c.scope.trim()||c.needTest.trim()))e.push('Bạn chọn “Giáo viên tự nhập nội dung” nhưng chưa nhập nội dung kiến thức.');
 if(c.sourceMode==='plus'&&!(c.content.trim()||c.topic.trim()||c.scope.trim()||c.needTest.trim()||c.docs.length||c.refText.trim()||c.matrixLock))e.push('Chưa có nội dung kiến thức: hãy nhập tên bài/chủ đề, phạm vi hoặc tải tài liệu.');

async function doGenerate(){
 if(S.busy)return;const c=S.cfg;

 const errs=[...ve,...plan.errs];
 if(errs.length)return alertBox('Cần bổ sung thiết lập',`<ul>${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`);
 if(S.exam&&!await confirmBox('Đề hiện tại sẽ được thay bằng đề mới (có thể Hoàn tác). Tiếp tục?'))return;
 saveLast();S.planPrev={slots:plan.slots,step:plan.step,sig:planSig()};
 const fixed=[];const notes=[];
 if(c.keepTeacher&&c.teacherText.trim()){
  const used=new Set();
  parseTeacher(c.teacherText).forEach(tq=>{const sl=plan.slots.find(s=>s.type===tq.type&&!used.has(s.id));if(sl){used.add(sl.id);fixed.push(teacherQ(tq,sl))}else notes.push(`Một câu ${TYPES[tq.type].n} của giáo viên không còn vị trí trong cấu trúc đề nên bị bỏ qua.`)})}
 let nb=0;
 if(c.useBank){const bank=bankGet();const used=new Set(fixed.map(f=>f.id));
  plan.slots.forEach(sl=>{if(used.has(sl.id))return;const i=bank.findIndex(b=>!b._u&&b.type===sl.type&&b.level===sl.level&&b.subject===subjectOf(c)&&String(b.grade)===String(c.grade)&&b.topic===sl.topic&&!b.empty&&b.question);
   if(i>=0){bank[i]._u=1;const b=Object.assign({options:['','','',''],pairs:[],rightOrder:[],rubric:[],unit:'',outcome:'',explanation:'',gradingNotes:'',correctAnswer:''},clone(bank[i]));delete b.bid;delete b._u;b.id=sl.id;b.score=sl.score;b.locked=true;b.src='bank';b.kind=sl.kind||b.kind||'';b.level=sl.level;b.topic=sl.topic;
    if(b.type==='essay'&&b.rubric.length)b.rubric=rubricFrom(b.rubric.map(r=>({content:r.content,weight:r.weight||r.score})),sl.score,0.25);
    if(b.type==='match'&&b.rightOrder.length!==b.pairs.length)b.rightOrder=makeRight(b.pairs,b.id);
    used.add(sl.id);fixed.push(b);nb++}})}
 S.busy=true;refreshLive();
 try{
  const r=await runPipeline(plan.slots,{fixed});
  if(S.exam)pushHist('Trước khi tạo đề mới');

  autoFixLocal(S.exam);S.ver=101;S.tab='exam';rerender();scrollPreview();if(nb)toast(`📚 Đã dùng ${nb} câu từ ngân hàng.`,4500);
  const bad=S.exam.questions.filter(q=>q.uncertain||q.empty).length;
  toast('✅ Đề đã được tạo và kiểm tra.'+(bad?` Có ${bad} câu cần giáo viên kiểm tra.`:''),5000);
  [...r.notes,...notes].forEach(n=>toast(n,6000));
 }catch(e){if(e?.code==='cancelled')toast('Đã hủy tạo đề.');else alertBox('Không tạo được đề',`<p>${esc(e?.message||e?.code||'Lỗi không xác định')}</p>${e?.code==='not_granted'?'<p>Bạn cần cho phép trang gọi Claude để tạo câu hỏi.</p>':''}`)}
 finally{S.busy=false;refreshLive()}}

   const items=fv('ed_rub').split('\n').map(l=>l.split('|')).filter(a=>a[0].trim()).map(a=>({content:a[0].trim(),weight:parseFloat((a[1]||'').replace(',','.'))||1}));

 setLevel:d=>{if(S.cfg.level!==d.v){S.cfg.level=d.v;S.cfg.grade='';if(S.cfg.subject&&!SCHOOL[d.v].subjects.includes(S.cfg.subject)&&!S.cfg.customSubject)S.cfg.subject=''}renderSetup();saveDraft()},
 setGrade:d=>{S.cfg.grade=+d.v;S.step=1;renderSetup();saveDraft()},
 setSubject:d=>{S.cfg.subject=d.v;S.cfg.customSubject='';S.step=2;renderSetup();saveDraft()},
 applyTpl:d=>{const t=TEMPLATES[+d.v],c=S.cfg;Object.keys(c.counts).forEach(k=>c.counts[k]=0);Object.keys(c.essay).forEach(k=>c.essay[k]=0);Object.keys(c.partScores).forEach(k=>c.partScores[k]=0);Object.assign(c.counts,t.counts);Object.assign(c.essay,t.essay);c.duration=t.dur;if(t.cdur)c.customDuration=t.cdur;c.scoreMode=t.parts?'part':'weight';if(t.parts)Object.assign(c.partScores,t.parts);c.matrixLock=false;c.matrixRows=null;renderSetup();saveDraft();toast('Đã áp dụng mẫu: '+t.n,4000)},
 tpMode:d=>{const c=S.cfg;c.topicMode=d.v;if(d.v==='manual'&&!Object.values(c.topicQ).some(v=>+v)){const tp=topicsOf(c),a=lrm(totalOf(c),tp.map(()=>1));tp.forEach((t,i)=>c.topicQ[t]=a[i])}renderSetup();saveDraft()},
 qSel:(d,b)=>{b.closest('.q')?.classList.toggle('sel')},
 rmDoc:d=>{S.cfg.docs.splice(+d.v,1);$('#docList').innerHTML=docListHtml();saveDraft()},
 lvMode:d=>{S.cfg.levelMode=d.v;renderSetup();saveDraft()},
 autoSplit:()=>{const t=totalOf(S.cfg),a=lrm(t,[40,30,20,10]);LEVELS.forEach((l,i)=>S.cfg.lvCount[l.k]=a[i]);renderSetup();saveDraft()},
 parseMatrix:()=>parseMatrixAI(),
 clearMatrix:()=>{S.cfg.matrixRows=null;S.cfg.matrixLock=false;renderSetup();toast('Đã bỏ ma trận tải lên.')},
 saveLastCfg:()=>{saveLast();toast('Đã lưu cấu hình.')},
 restoreCfg:()=>{const c=store.get('rdk_cfg',null);if(!c)return toast('Chưa có cấu hình đã lưu.');loadCfg(c);renderSetup();renderPreview();toast('Đã khôi phục cấu hình gần nhất.')},
 clearCfg:async()=>{if(!await confirmBox('Xóa toàn bộ cấu hình đã lưu và đặt lại thiết lập? (Đề đang xem không bị xóa)','Xóa cấu hình'))return;store.del('rdk_cfg');store.del('rdk_cfg_draft');S.cfg=DEF();S.step=0;S.planPrev=null;renderSetup();renderPreview();toast('Đã xóa toàn bộ cấu hình.')},
 makeMatrix:doMatrix,verifyExam:doVerify,generate:doGenerate,
 regenAll:()=>{if(!S.exam)return toast('Hãy tạo đề trước.');doGenerate()},equivalent:doEquivalent,
 saveExam,copyExam,printExam,exportMenu,history:openHist,undo,clearExam,
 tab:d=>{S.tab=d.v;renderPreview()},
 qRegen:d=>regenOne(d.id),qEdit:d=>editQ(d.id),qDel:d=>delQ(d.id),qAdd:d=>addQ(d.id),
 qBank:d=>{const q=qById(d.id);if(!q||q.empty)return toast('Câu chưa có nội dung.');toBank(q);toast('📚 Đã lưu vào ngân hàng câu hỏi.')},
 openBank,openSaved};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){try{const r=f(b.dataset,b,e);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Có lỗi: '+(err.message||err))})}catch(err){console.error(err);toast('Có lỗi: '+(err.message||err))}}});
window.addEventListener('pagehide',()=>{store.set('rdk_cfg_draft',slimCfg())});

/* ============ 21. KHỞI TẠO ============ */
(function init(){
 const d=store.get('rdk_cfg_draft',null)||store.get('rdk_cfg',null);if(d){try{loadCfg(d)}catch(e){}}
 const ex=store.get('rdk_exam_cur',null);if(ex&&ex.questions&&ex.meta){S.exam=ex}
 renderSetup();renderPreview();
 if(d)toast('Đã khôi phục cấu hình lần làm việc trước.');
 getSample();
})();
</script></body></html>
