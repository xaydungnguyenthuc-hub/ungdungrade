<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ứng dụng AI hỗ trợ giáo viên Việt Nam ra đề kiểm tra cho Tiểu học, THCS, THPT – mọi môn học.">
<title>RA ĐỀ KIỂM TRA AI – 3 CẤP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style id="sheetcss">
.sheet,.sheet *{box-sizing:border-box}
.sheet{font-family:"Times New Roman",Times,serif;font-size:14pt;line-height:1.45;color:#111}
.exh-top{display:flex;justify-content:space-between}.exh-title{text-align:center;font-weight:700;font-size:1.2em;margin:8px 0 2px}.exh-sub{text-align:center;margin-bottom:8px}
.exh-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;border-top:1px solid #222;border-bottom:1px solid #222;padding:6px 0}.exh-grid .full{grid-column:1/-1}
.sec{margin:14px 0 6px;font-weight:700}.sec small{font-weight:400;display:block;font-style:italic}
.q{margin:8px 0;break-inside:avoid;page-break-inside:avoid}.qt{white-space:pre-wrap}
.opts{display:grid;gap:2px 16px;margin:3px 0 0 14px}.opts.c1{grid-template-columns:1fr}.opts.c2{grid-template-columns:1fr 1fr}.opts.c4{grid-template-columns:repeat(4,1fr)}
.stm{margin:2px 0 0 14px}.mt{width:100%;border-collapse:collapse}.mt td{vertical-align:top;padding:2px 8px;width:50%}
table.t{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:.93em}table.t th,table.t td{border:1px solid #444;padding:4px 7px;vertical-align:top;text-align:left}table.t th{background:#e8eefc;text-align:center}table.t td.c{text-align:center}
.cell small{display:block;color:#444;font-size:.85em}.rowtot td{font-weight:700;background:#f3f6fc}.ans{font-weight:700}
@media (max-width:640px){.opts.c4{grid-template-columns:1fr 1fr}.opts.c2{grid-template-columns:1fr}.exh-grid{grid-template-columns:1fr}}
.flag,.lock{font-size:.75em;border-radius:6px;padding:1px 7px;margin-left:6px;background:#fff3d9;color:#9a5b00}
</style>
</head>
<body>
<div class="appshell">
<header class="topbar">
 <div class="brand"><div class="logo">AI</div><div><h1>RA ĐỀ KIỂM TRA AI – 3 CẤP</h1><p>Tiểu học • THCS • THPT • Mọi môn học</p></div></div>
 <div class="top-actions">
  <button class="tbtn" data-act="openBank">📚 Ngân hàng câu hỏi</button>
  <button class="tbtn" data-act="openSaved">🗂 Đề đã lưu</button>
  <button class="tbtn" data-act="restoreCfg">↺ Khôi phục cấu hình gần nhất</button>
  <button class="tbtn" data-act="clearCfg">🗑 Xóa toàn bộ cấu hình</button>
 </div>
</header>
<main class="layout">
 <aside class="panel" id="setup">
  <div class="stepper" id="stepper"></div>
  <div class="stepbody" id="stepbody"></div>
  <div class="panel-foot">
   <div class="navrow"><button class="btn" data-act="prevStep">← Trước</button><button class="btn" data-act="nextStep">Tiếp →</button></div>
   <button class="btn" data-act="makeMatrix">📊 Tạo ma trận</button>
   <button class="bigbtn" id="genBtn" data-act="generate">✨ TẠO ĐỀ KIỂM TRA</button>
  </div>
 </aside>
 <section class="preview">
  <div class="summary" id="summary"></div>
  <div class="ptoolbar">
   <div class="tg"><button class="btn sm" data-act="regenAll">🔄 Tạo lại</button><button class="btn sm" data-act="equivalent">🧬 Tạo đề tương đương</button><button class="btn sm" data-act="verifyExam">🔍 Kiểm tra đề</button></div>
   <div class="tg"><button class="btn sm" data-act="saveExam">💾 Lưu</button><button class="btn sm" data-act="copyExam">📋 Sao chép</button><button class="btn sm" data-act="exportMenu">⬇ Xuất ▾</button><button class="btn sm" data-act="printExam">🖨 In</button></div>
   <div class="tg end"><button class="btn sm" data-act="undo">↩ Hoàn tác</button><button class="btn sm" data-act="history">🕘 Lịch sử</button><button class="btn sm danger" data-act="clearExam">🗑 Xóa</button></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pcontent" id="pcontent"></div>
 </section>
</main>
<footer class="foot">Đề được AI hỗ trợ tạo. Giáo viên cần kiểm duyệt nội dung, đáp án và mức độ phù hợp trước khi sử dụng chính thức.</footer>
</div>
<div id="printArea"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<noscript>Ứng dụng cần bật JavaScript để hoạt động.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/standalone.js"></script>
<script src="js/core.js"></script>
<script src="js/ai.js"></script>
<script src="js/setup.js"></script>
<script src="js/docx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
